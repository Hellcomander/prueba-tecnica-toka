map $uri $api_backend {
    ~^/api/v1/(auth|accounts)(/|$) auth-service:3001;
    ~^/api/v1/users(/|$) user-service:3002;
    ~^/api/v1/(roles|permissions|user-roles)(/|$) role-service:3003;
    ~^/api/v1/audit(/|$) audit-service:3004;
    ~^/api/v1/agent(/|$) ai-agent-service:3005;
    default "";
}

# El correlation-id nace en la SPA y debe sobrevivir el viaje completo (SPA → gateway →
# servicios → headers AMQP → consumidores), que es lo que permite seguir una acción del usuario
# a través de los cinco servicios con un solo `jq`. Si el cliente no manda uno, lo genera nginx.
# No hace falta validar aquí: cada servicio solo acepta un valor con formato seguro
# (^[A-Za-z0-9-]{8,64}$, ver resolveCorrelationId en @toka/nest-common) y si no, genera el suyo.
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=agent_api:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    resolver 127.0.0.11 ipv6=off valid=10s;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Correlation-ID $correlation_id;
    proxy_set_header Authorization $http_authorization;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location ^~ /api/v1/auth/login {
        if ($api_backend = "") {
            return 404;
        }
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://$api_backend;
    }

    location ^~ /api/v1/agent {
        if ($api_backend = "") {
            return 404;
        }
        limit_req zone=agent_api burst=5 nodelay;
        proxy_pass http://$api_backend;
    }

    location /api/ {
        if ($api_backend = "") {
            return 404;
        }
        proxy_pass http://$api_backend;
    }

    location ~ ^/\.well-known/ {
        set $auth_backend auth-service:3001;
        proxy_pass http://$auth_backend;
    }

    location / {
        proxy_pass http://web:8080;
    }
}
