name: toka

# Corre sin .env (modo mock): toda variable tiene default `${VAR:-x}`.
# Solo el gateway publica un puerto al host; el resto vive en redes internas.
# Las credenciales por defecto son de desarrollo local; .env.example documenta cómo cambiarlas.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Chequeos rápidos solo durante el arranque (start_interval) y espaciados después,
# para no gastar CPU en estado estable.
x-healthcheck: &hc
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s
  start_interval: 2s

x-infra: &infra
  restart: unless-stopped
  logging: *logging
  networks: [backend]
  security_opt: ["no-new-privileges:true"]

# Servicios Node: usuario no root (en la imagen), FS de solo lectura, sin capabilities, init
# para reenviar señales (apagado ordenado) y límite de memoria.
x-node-svc: &node-svc
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  networks: [backend]
  mem_limit: 256m

x-node-env: &node-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NODE_OPTIONS: --max-old-space-size=160
  OIDC_ISSUER: http://auth-service:3001
  TRUST_PROXY_HOPS: "1"
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-toka}:${RABBITMQ_PASSWORD:-rabbit_dev_pw}@rabbitmq:5672
  CHECKPOINT_DISABLE: "1"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"

services:
  postgres:
    <<: *infra
    image: postgres:17.11-alpine
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=60"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pw}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_pw}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-user_dev_pw}
      ROLE_DB_PASSWORD: ${ROLE_DB_PASSWORD:-role_dev_pw}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: el socket unix responde antes de que termine el init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      <<: *hc
    mem_limit: 256m

  mongo:
    <<: *infra
    image: mongo:8.0.34
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--quiet"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongo_dev_pw}
      MONGO_AUDIT_DB: audit_db
      MONGO_AUDIT_USER: audit_svc
      MONGO_AUDIT_PASSWORD: ${MONGO_AUDIT_PASSWORD:-audit_dev_pw}
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Conexión TCP **por el nombre de red**, no por localhost: durante la inicialización el
      # entrypoint oficial levanta un mongod que solo escucha en localhost para correr los
      # scripts de init, así que esto no pasa a healthy hasta que el init terminó. Es la misma
      # propiedad de orden que daba el chequeo anterior con mongosh, sin su costo.
      #
      # Por qué se cambió: `mongosh` es un proceso Node de ~100 MB y en esta máquina tardaba
      # 13–18 s en arrancar, por encima del timeout de 10 s, así que Mongo quedaba *unhealthy*
      # en reposo con mongod al 2 % de CPU. Es exactamente el hallazgo de `docs/spikes.md`
      # (un mecanismo de observabilidad mal dimensionado causa el incidente), repetido.
      #
      # Que `audit_svc` pueda autenticarse lo sigue garantizando el propio audit-service: su
      # /health/ready hace ping sobre la conexión Mongoose abierta con ese usuario, y
      # `compose up --wait` espera a que ESE contenedor esté healthy.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/mongo/27017"]
      <<: *hc
      start_period: 60s
    mem_limit: 512m

  redis:
    <<: *infra
    image: redis:7.4.12-alpine
    # El entrypoint de la imagen solo baja a usuario redis si el comando empieza con redis-server;
    # como se envuelve en `sh -c` para leer la contraseña del entorno, se fija el usuario aquí.
    user: redis
    # Cache y límites efímeros: sin persistencia, noeviction (los límites no deben desaparecer
    # por presión de memoria) y todas las llaves con TTL.
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb
      --maxmemory-policy noeviction --save "" --appendonly no'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_pw}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      <<: *hc
    mem_limit: 160m

  rabbitmq:
    <<: *infra
    image: rabbitmq:4.3.7-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-toka}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit_dev_pw}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark {absolute,268435456}"
    ports:
      - "127.0.0.1:15672:15672" # UI de administración, solo desde la máquina local
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      # Chequeo TCP del listener AMQP: equivale a check_port_connectivity sin levantar una VM
      # de Erlang por chequeo (rabbitmq-diagnostics cuesta ~80 MB y CPU cada vez).
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      <<: *hc
      start_period: 60s
    mem_limit: 384m

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_MODE: ${VITE_API_MODE:-real}
    image: toka/web:dev
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [backend]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      <<: *hc

  gateway:
    restart: unless-stopped
    build: { context: ., dockerfile: infra/gateway/Dockerfile }
    image: toka/gateway:dev
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [edge, backend]
    mem_limit: 96m
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      <<: *hc

  # Store vectorial de la base de conocimiento (Parte 2). No comparte volumen con nada más: su
  # contenido se reconstruye entero desde los markdown del repositorio, así que perderlo no
  # pierde información, solo tiempo de reindexado.
  qdrant:
    <<: *infra
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: WARN
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 384m
    healthcheck:
      # La imagen no trae wget, curl ni nc, pero sí bash: se usa su /dev/tcp contra /readyz.
      # (sh en esta imagen es dash, que no soporta /dev/tcp; por eso bash explícito.)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      <<: *hc

  # auth-service es el IdP: dueño de las credenciales y única fuente de los JWT. El volumen
  # auth-keys guarda el par RS256 para que los tokens sobrevivan a un reinicio (si no, cada
  # arranque invalidaría las sesiones de todos). No depende de role-service: la llamada S1 es
  # resiliente (breaker + copia stale), así que auth arranca aunque role todavía no esté.
  auth-service:
    <<: *node-svc
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    image: toka/auth-service:dev
    environment:
      <<: *node-env
      PORT: "3001"
      DATABASE_URL: postgresql://auth_svc:${AUTH_DB_PASSWORD:-auth_dev_pw}@postgres:5432/auth_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pw}@redis:6379
      ROLE_SERVICE_URL: http://role-service:3003
      JWT_KEYS_DIR: /keys
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!demo}
      SEED_AUDITOR_PASSWORD: ${SEED_AUDITOR_PASSWORD:-Auditor123!demo}
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD:-Viewer123!demo}
    volumes:
      - auth-keys:/keys
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/ready"]
      <<: *hc
      start_period: 60s

  user-service:
    <<: *node-svc
    build: { context: ., dockerfile: services/user-service/Dockerfile }
    image: toka/user-service:dev
    environment:
      <<: *node-env
      PORT: "3002"
      DATABASE_URL: postgresql://user_svc:${USER_DB_PASSWORD:-user_dev_pw}@postgres:5432/user_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pw}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health/ready"]
      <<: *hc
      start_period: 60s

  role-service:
    <<: *node-svc
    build: { context: ., dockerfile: services/role-service/Dockerfile }
    image: toka/role-service:dev
    environment:
      <<: *node-env
      PORT: "3003"
      DATABASE_URL: postgresql://role_svc:${ROLE_DB_PASSWORD:-role_dev_pw}@postgres:5432/role_db
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health/ready"]
      <<: *hc
      start_period: 60s

  # audit-service es read model puro sobre Mongo: no necesita Postgres ni Redis.
  audit-service:
    <<: *node-svc
    build: { context: ., dockerfile: services/audit-service/Dockerfile }
    image: toka/audit-service:dev
    environment:
      <<: *node-env
      PORT: "3004"
      MONGO_URL: mongodb://audit_svc:${MONGO_AUDIT_PASSWORD:-audit_dev_pw}@mongo:27017/audit_db?authSource=audit_db
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health/ready"]
      <<: *hc
      start_period: 60s

  # Agente de IA (Parte 2). Arranca aunque no haya GEMINI_API_KEY: con AI_PROVIDER=auto y sin
  # clave usa el proveedor mock determinista, así el stack completo corre sin secretos.
  # No espera a user/role/audit con service_healthy: las herramientas son opcionales y un vecino
  # lento no debe impedir que el asistente levante para responder con solo RAG.
  ai-agent-service:
    <<: *node-svc
    build: { context: ., dockerfile: services/ai-agent-service/Dockerfile }
    image: toka/ai-agent-service:dev
    mem_limit: 320m
    environment:
      <<: *node-env
      PORT: "3005"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pw}@redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-toka_kb}
      USER_SERVICE_URL: http://user-service:3002
      ROLE_SERVICE_URL: http://role-service:3003
      AUDIT_SERVICE_URL: http://audit-service:3004
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIM: ${GEMINI_EMBEDDING_DIM:-768}
      AI_LLM_TIMEOUT_MS: ${AI_LLM_TIMEOUT_MS:-15000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-agent-v2}
      AI_GLOBAL_RPM: ${AI_GLOBAL_RPM:-8}
      AI_GLOBAL_RPD: ${AI_GLOBAL_RPD:-200}
      AI_USER_RPM: ${AI_USER_RPM:-4}
      AI_USER_DAILY_TOKENS: ${AI_USER_DAILY_TOKENS:-50000}
    depends_on:
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/health/ready"]
      <<: *hc
      start_period: 60s


networks:
  edge: {}
  backend: {}

volumes:
  pg-data: {}
  mongo-data: {}
  rabbit-data: {}
  auth-keys: {}
  qdrant-data: {}
